name: Build MobileBloxV2 ARM64

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name'
        required: false
        default: '2.0.0'

permissions:
  contents: read

jobs:
  build:
    name: Build ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK (includes NDK)
        uses: android-actions/setup-android@v2
        with:
          api-level: 34
          ndk-version: r26d
          cmdline-tools-version: latest

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache CMake
        uses: actions/cache@v4
        with:
          path: |
            ~/.cmake
            build/arm64
          key: cmake-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt', '**/build_termux_arm64.sh') }}
          restore-keys: cmake-${{ runner.os }}-

      - name: Configure CMake (ARM64)
        run: |
          export ANDROID_NDK_HOME=$ANDROID_NDK_ROOT
          mkdir -p build/arm64
          cd build/arm64
          cmake -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            ../..

      - name: Build Native Library
        run: |
          cd build/arm64
          ninja -j$(nproc) MobileBlox

      - name: Verify Native Library
        run: |
          file build/arm64/libMobileBlox.so
          ls -lh build/arm64/libMobileBlox.so

      - name: Setup Gradle
        run: |
          chmod +x gradlew
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp build/arm64/libMobileBlox.so app/src/main/jniLibs/arm64-v8a/

      - name: Build APK
        run: |
          ./gradlew assembleRelease --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" \
            -Pandroid.ndkPath=$ANDROID_NDK_HOME

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          echo "APK size: $(du -h $APK | cut -f1)"
          unzip -l $APK | grep libMobileBlox.so

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MobileBloxV2-ARM64
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Upload Native Library
        uses: actions/upload-artifact@v4
        with:
          name: libMobileBlox-ARM64
          path: build/arm64/libMobileBlox.so
          retention-days: 30

  release:
    name: Create Release
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: MobileBloxV2-ARM64
          path: artifacts

      - name: Download Native Lib
        uses: actions/download-artifact@v4
        with:
          name: libMobileBlox-ARM64
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: github.event.inputs.version != ''
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: MobileBlox V2 ${{ github.event.inputs.version }} (ARM64)
          files: |
            artifacts/app-release.apk
            artifacts/libMobileBlox.so
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}